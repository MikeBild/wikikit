<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="color-scheme" content="light dark" />
    <!--
      WELCHES PRODUKT DIESE KONSOLE IST — die EINZIGE Stelle, an der das steht.

      Die Konvention macht die DOM-Verankerungen der Familienkonsolen
      absichtlich gleich (`cockpit-wordmark`, `operator-role`, `sidebar`,
      `page-title`), damit ein Prüflauf eine gemeinsame Verankerung hat. Der
      Preis: eine fremde Konsole erfüllt jede Vorbedingung, an der ein Lauf
      sonst scheitern würde, und die Prüfstände liegen dicht beieinander. Ein
      Lauf gegen das falsche Gegenüber findet dann jeden Selektor, den er sucht,
      und schreibt fremde Verstöße diesem Produkt zu — kein Timeout, kein
      Absturz, ein vollständiger und falscher Bericht. Der Vorfall und die
      Portlage stehen in scripts/konvention-check.mjs.

      Dieses Skript LIEST die Zeile hier (readFileSync) und hält sie gegen das
      Dokument, das der Prüfstand ausliefert — vor dem Browserstart. Der
      Sollwert wird also abgeleitet und nirgends abgetippt: wer den Wert hier
      ändert, ändert beide Seiten in einem Zug.

      Ausdrücklich NICHT der <title> und nicht die Wortmarke: beides sind Regeln
      (§6), die derselbe Lauf gebrochen finden können muss. Eine Kennung, die
      zugleich Prüfgegenstand ist, macht aus jedem echten Verstoß ein „fremdes
      Dokument" und misst danach nichts mehr.

      Ein <meta> und kein Kommentar. Nachgemessen trägt die gebaute Fassung
      heute BEIDES — auch diesen Kommentar hier —, aber das ist eine Zusage, die
      niemand gegeben hat: ein Minifier darf Kommentare fallen lassen, `<meta
      name>`/`content` nicht. Die Kennung darf an so etwas nicht hängen; sie
      muss den Build überleben, weil die Gate-Stufe gegen die GEBAUTE Fassung
      misst. test/unit/cockpit-embedded-drift.test.ts hält genau das fest.
    -->
    <meta name="cockpit-product" content="WikiKit" />
    <title>WikiKit Cockpit</title>
    <!--
      „/favicon.svg", NICHT „/cockpit/favicon.svg" und nicht „./favicon.svg" —
      und das ist die eine Stelle, an der dieser Verweis dreimal falsch sein
      kann (§6).

      Das Cockpit wird unter /cockpit/ ausgeliefert. Den Basispfad setzt Vite
      selbst davor: aus dieser Zeile wird in der gebauten Fassung
      href="/cockpit/favicon.svg". Wer ihn hier schon hinschreibt, bekommt ihn
      zweimal — /cockpit/cockpit/favicon.svg. Und „./favicon.svg" löst auf
      Unterrouten wie /cockpit/pages/… gegen ein Verzeichnis auf, das es nicht
      gibt.

      Ein Favicon-Verweis ins Leere ist schlimmer als keiner: er sieht im
      Quelltext wie Erfüllung aus und liefert dem Reiter trotzdem nichts. Hier
      besonders leise, weil src/cockpit.ts alles, was keine Datei ist, mit der
      SPA-Hülle beantwortet — also mit 200 und text/html statt mit einem 404.
      Der Konventions-Check prüft deshalb den Content-Type mit, nicht nur den
      Statuscode.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // BLOCKING, and in the document rather than in the bundle. The class has
      // to be on <html> before the first paint; applied from an effect instead,
      // a dark-mode reload shows a full white frame first, which at 03:00 is
      // the difference between reading a page and flinching away from it.
      //
      // The key is absent for "follow the OS" — that is why this asks whether
      // it is missing rather than comparing it to the string 'system'
      // (CUI-THEME-2).
      //
      // This is the console's ONLY inline script (CUI-MOUNT-4). The CSP in
      // src/cockpit.ts admits it by the sha256 of these exact bytes, so a
      // change here changes the header without anybody editing the header.
      try {
        var stored = localStorage.getItem('wk-cockpit-theme')
        var dark = stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

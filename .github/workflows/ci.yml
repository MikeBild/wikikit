# CI for every push to main and every PR: lint → typecheck → cockpit-drift →
# Konventions-Check → unit + contract → integration → e2e → build-binary. Fast
# checks run as parallel jobs; the binary build gates on all of them so a red
# check can never produce a green "buildable" signal.
#
# These are the same stages as scripts/gate.ts (`bun run gate`), which runs
# locally as a pre-push hook — CI is the backstop, not the first place you
# learn a check exists.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded pushes to the same branch/PR cancel their in-flight run — CI
# feedback should always describe the latest commit, not a stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # --frozen-lockfile: CI must build exactly what bun.lock pins; a
      # package.json/bun.lock mismatch is a bug, not something to auto-heal.
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # Served shell scripts (agent hooks + installer) — shellcheck ships on
      # ubuntu-latest, no extra dependency.
      - run: shellcheck examples/agent-hooks/*.sh src/http/install/install.sh

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # tsc --noEmit — bun runs TS natively (no build step), so the compiler
      # exists purely as a static gate.
      - run: bun run typecheck

  # The console is a committed build artifact. assets/cockpit and
  # src/cockpit-embedded.ts are generated, committed and served — the compiled
  # binary reads the embed, so a stale one ships an old console against a new
  # API and nothing at runtime notices. This rebuilds from source and fails on
  # any diff, which also proves the Vite build still works on a clean checkout.
  cockpit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check:cockpit-drift

  # Die Familien-Konvention gegen das eigene Cockpit (COCKPIT-KONVENTION.md):
  # Wortmarke, Browser-Titel, Favicon, Entscheidungs-Grammatik, Routen-Sweep.
  # Dieselbe Stufe wie `konvention` in scripts/gate.ts, und sie steht hier aus
  # demselben Grund wie jede andere: bis 2026-08-20 lief dieser Check in keinem
  # der sechs Produkte automatisch, und eine Zusicherung, die niemand fragt, ist
  # ein Kommentar (BEFUND-CHECK-LAEUFT-NIRGENDS.md).
  #
  # KONVENTION_CHECK_STAND=preview misst die GEBAUTE Fassung statt des
  # Dev-Servers — der löst Verweise beim Ausliefern selbst auf und ist damit
  # blind für einen Favicon-Verweis, der auf tiefen Routen ins Leere zeigt.
  # Deshalb baut der Job davor; im lokalen Gate erledigt das die Stufe `cockpit`.
  konvention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Der einzige Job mit einem Browser. --with-deps, weil ein nacktes
      # ubuntu-latest die Systembibliotheken von Chromium nicht mitbringt.
      - run: bunx playwright install --with-deps chromium
      - run: bun run build:cockpit
      - run: bun run konvention:check
        env:
          KONVENTION_CHECK_STAND: preview

  # Unit + contract suites are pure (FakeProvider, no network, no Postgres).
  # Contract snapshots (OpenAPI, MCP manifest, webhook payloads, OKF) are the
  # promises foreign systems rely on — a snapshot diff must fail CI until it
  # is committed deliberately.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test test/unit test/contract

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        # Credentials/port mirror the zero-config contract in
        # scripts/start-local.ts (LOCAL_DATABASE_URL,
        # postgresql://postgres:wikikit-local@127.0.0.1:55442/wikikit) — the
        # suites connect to that URL verbatim.
        env:
          POSTGRES_PASSWORD: wikikit-local
          POSTGRES_DB: wikikit
        ports:
          - '55442:5432'
        # --name is load-bearing: test/integration provisions databases via
        # ensureLocalPostgres(), which docker-inspects the container named
        # wikikit-local-postgres and would otherwise try to `docker run` a
        # second Postgres on the already-bound port. The runner puts user
        # options after its generated --name, so ours wins and the helper
        # sees "already running" and no-ops. The health check makes the
        # runner wait until initdb finished before any step runs.
        options: >-
          --name wikikit-local-postgres
          --health-cmd "pg_isready -U postgres -d wikikit"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # RUN_INTEGRATION=1 is the explicit opt-in gate the suites check —
      # without it every integration test self-skips (local default).
      - run: bun run test:integration
        env:
          RUN_INTEGRATION: '1'

  # The vendor edge. Every other suite injects FakeProvider, so the AI SDK
  # wiring — structured-output request, cache_control placement, usage mapping,
  # error mapping — is untested there. This tier points the REAL SDK at a stub
  # Anthropic endpoint (test/e2e/llm-stub.ts), so a dependency bump that breaks
  # prompt caching (a 5x bill that fails nothing else) fails the PR instead.
  # No API key, no network, no cost.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: wikikit-local
          POSTGRES_DB: wikikit
        ports:
          - '55442:5432'
        options: >-
          --name wikikit-local-postgres
          --health-cmd "pg_isready -U postgres -d wikikit"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e
        env:
          RUN_INTEGRATION: '1'

  # Compiling the binary in CI keeps plan risk #5 (bun --compile with pg/
  # unified) permanently verified — a dependency that breaks --compile fails
  # the PR that introduces it, not the next release. build-binary.sh already
  # asserts the binary reports the package.json version; the extra --version
  # step proves the artifact executes on a machine with no Bun involvement.
  binary:
    needs: [lint, typecheck, test, integration, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bash build-binary.sh
      - run: ./dist/wikikit --version

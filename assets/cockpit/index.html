    <title>WikiKit Cockpit</title>
    <!--
      „/favicon.svg", NICHT „/cockpit/favicon.svg" und nicht „./favicon.svg" —
      und das ist die eine Stelle, an der dieser Verweis dreimal falsch sein
      kann (§6).

      Das Cockpit wird unter /cockpit/ ausgeliefert. Den Basispfad setzt Vite
      selbst davor: aus dieser Zeile wird in der gebauten Fassung
      href="/cockpit/favicon.svg". Wer ihn hier schon hinschreibt, bekommt ihn
      zweimal — /cockpit/cockpit/favicon.svg. Und „./favicon.svg" löst auf
      Unterrouten wie /cockpit/pages/… gegen ein Verzeichnis auf, das es nicht
      gibt.

      Ein Favicon-Verweis ins Leere ist schlimmer als keiner: er sieht im
      Quelltext wie Erfüllung aus und liefert dem Reiter trotzdem nichts. Hier
      besonders leise, weil src/cockpit.ts alles, was keine Datei ist, mit der
      SPA-Hülle beantwortet — also mit 200 und text/html statt mit einem 404.
      Der Konventions-Check prüft deshalb den Content-Type mit, nicht nur den
      Statuscode.
    -->
    <link rel="icon" type="image/svg+xml" href="/cockpit/favicon.svg" />
    <script>
      // BLOCKING, and in the document rather than in the bundle. The class has
      // to be on <html> before the first paint; applied from an effect instead,
      // a dark-mode reload shows a full white frame first, which at 03:00 is
      // the difference between reading a page and flinching away from it.
      //
      // The key is absent for "follow the OS" — that is why this asks whether
      // it is missing rather than comparing it to the string 'system'
      // (CUI-THEME-2).
      //
      // This is the console's ONLY inline script (CUI-MOUNT-4). The CSP in
      // src/cockpit.ts admits it by the sha256 of these exact bytes, so a
      // change here changes the header without anybody editing the header.
      try {
        var stored = localStorage.getItem('wk-cockpit-theme')
        var dark = stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>

    <link rel="modulepreload" crossorigin href="/cockpit/assets/rolldown-runtime-hePW80VL.js">
    <link rel="modulepreload" crossorigin href="/cockpit/assets/markdown-BwP_2TDL.js">
    <link rel="modulepreload" crossorigin href="/cockpit/assets/react-C2fe6riJ.js">
    <link rel="modulepreload" crossorigin href="/cockpit/assets/tanstack-Dl4Go0zr.js">
    <link rel="stylesheet" crossorigin href="/cockpit/assets/index-C-9GGEI7.css">

    <meta name="cockpit-ui-digest" content="sha256-4ca18a25cbcf" />
